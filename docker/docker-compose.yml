services:
  # Main WhatsApp Chat Viewer Service
  main-service:
    build:
      context: ../main-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=25432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - ZIPPER_SERVICE_URL=http://zipper-service:8081
      - ZIPPER_API_KEY=your-secret-api-key
    volumes:
      - main-storage:/app/storage
      - main-temp:/app/temp
    depends_on:
      - postgres
      - zipper-service
    networks:
      - whatsapp-network
    restart: unless-stopped

  # Zipper Microservice
  zipper-service:
    build:
      context: ../zipper-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=25432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - MAIN_SERVICE_URL=http://main-service:8080
      - MAIN_SERVICE_API_KEY=your-secret-api-key
      - FILE_STORAGE_PATH=/app/storage
      - TEMP_STORAGE_PATH=/app/temp
      - MAX_CONCURRENT_JOBS=3
      - JOB_TIMEOUT_MINUTES=30
      - RETRY_ATTEMPTS=3
    volumes:
      - zipper-storage:/app/storage
      - zipper-temp:/app/temp
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - whatsapp-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: whatsapp_chatviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - whatsapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ (for future async communication)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - whatsapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (for caching and session management)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - whatsapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx (reverse proxy and load balancer)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - main-service
      - zipper-service
    networks:
      - whatsapp-network
    restart: unless-stopped

volumes:
  main-storage:
    driver: local
  main-temp:
    driver: local
  zipper-storage:
    driver: local
  zipper-temp:
    driver: local
  postgres-data:
    driver: local
  rabbitmq-data:
    driver: local
  redis-data:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
