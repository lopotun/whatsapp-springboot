# project-root/common-config.yml
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    net.kem.whatsapp: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:your-secret-key}
      expiration: ${JWT_EXPIRATION:86400000}

  file-storage:
    base-path: ${FILE_STORAGE_PATH:/tmp/whatsapp-storage}
    temp-path: ${TEMP_STORAGE_PATH:/tmp/whatsapp-temp}
    multimedia-path: ${MULTIMEDIA_STORAGE_PATH:/tmp/multimedia-files}
