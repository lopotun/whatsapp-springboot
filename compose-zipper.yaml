version: "3.8"

services:
  zipper-service:
    build:
      context: ./zipper-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - RABBITMQ_HOST=rabbitmq
      - MAIN_SERVICE_URL=http://host.docker.internal:8080
      - MAIN_SERVICE_API_KEY=your-secret-api-key
      - FILE_STORAGE_PATH=/app/storage
      - TEMP_STORAGE_PATH=/app/temp
    volumes:
      - zipper-storage:/app/storage
      - zipper-temp:/app/temp
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - zipper-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: whatsapp_chatviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zipper-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - zipper-network

volumes:
  zipper-storage:
  zipper-temp:
  postgres-data:
  rabbitmq-data:

networks:
  zipper-network:
    driver: bridge
